<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator">
    <div class="calc-header">
        <div class="brand">CITIZEN</div>
        <div class="model">LC-110N<br><span>AUTO POWER OFF</span></div>
    </div>

    <div class="display-container">
        <input type="text" class="display" id="display" value="0" readonly>
    </div>

    <div class="buttons">
        <button class="btn btn-red" onclick="clearAll()">C/CE</button>
        <button class="btn" onclick="toggleSign()">+/-</button>
        <button class="btn" onclick="calcSqrt()">√</button>
        <button class="btn" onclick="calcPercent()">%</button>

        <button class="btn btn-blue" onclick="backspace()">←</button>
        <button class="btn btn-blue" onclick="memory('minus')">M-</button>
        <button class="btn btn-blue" onclick="memory('plus')">M+</button>
        <button class="btn btn-blue" onclick="setOperation('/')">÷</button>

        <button class="btn btn-digit" onclick="appendNumber('7')">7</button>
        <button class="btn btn-digit" onclick="appendNumber('8')">8</button>
        <button class="btn btn-digit" onclick="appendNumber('9')">9</button>
        <button class="btn btn-blue" onclick="setOperation('*')">×</button>

        <button class="btn btn-digit" onclick="appendNumber('4')">4</button>
        <button class="btn btn-digit" onclick="appendNumber('5')">5</button>
        <button class="btn btn-digit" onclick="appendNumber('6')">6</button>
        <button class="btn btn-blue" onclick="setOperation('-')">−</button>

        <button class="btn btn-digit" onclick="appendNumber('1')">1</button>
        <button class="btn btn-digit" onclick="appendNumber('2')">2</button>
        <button class="btn btn-digit" onclick="appendNumber('3')">3</button>
        
        <button class="btn btn-blue btn-plus" onclick="setOperation('+')">+</button>

        <button class="btn btn-digit" onclick="appendNumber('0')">0</button>
        <button class="btn btn-digit" onclick="appendNumber('.')">.</button>
        <button class="btn btn-blue" onclick="calculate()">=</button>
    </div>
</div>


<script src="script.js"></script>
</body>
</html>
